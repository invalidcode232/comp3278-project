# MySQL 8 for the app, as an alternative to a local install.
#   docker compose up -d        # start (reads DB_PASSWORD and DB_PORT from .env)
#   docker compose down -v      # stop and delete the data volume
services:
  mysql:
    image: mysql:8.4
    container_name: comp3278-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example first)}
    ports:
      - "${DB_PORT:-3307}:3306"
    command:
      - --max-allowed-packet=64M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
